<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send Your Inspo Photo — ZOLA Nail Studio</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/img/zola-icon.png" />
  <link rel="apple-touch-icon" href="/img/zola-icon.png" />
  <meta name="theme-color" content="#140d07" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@200;300;400;600;800&family=Josefin+Sans:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { background: var(--soft-white); }
    .ins-wrap { max-width: 520px; margin: 0 auto; padding: 3.5rem 1.25rem 4rem; }
    .ins-logo { font-family: 'Cinzel', serif; font-size: 1.6rem; letter-spacing: 0.2em; color: var(--espresso); text-align: center; text-decoration: none; display: block; margin-bottom: 2rem; }
    .ins-card { background: #fff; border: 1px solid rgba(182,165,136,0.22); padding: 2rem 1.6rem; }
    .ins-h { font-family: 'Cinzel', serif; font-size: 1.6rem; color: var(--espresso); line-height: 1.25; margin-bottom: 0.6rem; }
    .ins-sub { font-family: 'Josefin Sans', sans-serif; font-size: 0.9rem; color: var(--latte); line-height: 1.75; margin-bottom: 1.5rem; }
    .ins-meta { background: var(--blush); padding: 0.9rem 1.1rem; margin-bottom: 1.5rem; font-family: 'Josefin Sans', sans-serif; font-size: 0.82rem; color: var(--espresso); line-height: 1.8; }
    .ins-meta b { color: var(--latte); font-weight: 600; }
    /* the whole tile is the file picker — one big target, nothing to read */
    .ins-drop { border: 2px dashed rgba(182,165,136,0.5); background: rgba(182,165,136,0.06); padding: 2.5rem 1rem; text-align: center; cursor: pointer; transition: all 0.2s; display: block; }
    .ins-drop:hover, .ins-drop:focus-visible { border-color: var(--champagne); background: rgba(182,165,136,0.13); }
    .ins-drop-ico { font-size: 2.2rem; }
    .ins-drop-t { font-family: 'Josefin Sans', sans-serif; font-size: 0.88rem; font-weight: 600; letter-spacing: 0.08em; color: var(--espresso); margin-top: 0.6rem; }
    .ins-drop-s { font-family: 'Josefin Sans', sans-serif; font-size: 0.74rem; color: var(--latte); margin-top: 0.3rem; }
    #ins-preview { display: none; margin-top: 1.1rem; }
    #ins-preview img { width: 100%; max-height: 340px; object-fit: cover; display: block; border: 1px solid rgba(182,165,136,0.25); }
    .ins-actions { display: none; margin-top: 1.1rem; gap: 0.6rem; flex-direction: column; }
    .ins-actions.on { display: flex; }
    .ins-btn { width: 100%; min-height: 52px; font-size: 0.78rem; }
    .ins-msg { font-family: 'Josefin Sans', sans-serif; font-size: 0.82rem; margin-top: 0.9rem; text-align: center; line-height: 1.6; }
    .ins-msg.err { color: #b43232; }
    .ins-done { display: none; text-align: center; padding: 1rem 0; }
    .ins-done-mark { font-size: 2.4rem; color: var(--champagne); }
    .ins-done-t { font-family: 'Cinzel', serif; font-size: 1.7rem; color: var(--espresso); margin: 0.5rem 0 0.5rem; }
    .ins-done-s { font-family: 'Josefin Sans', sans-serif; font-size: 0.88rem; color: var(--latte); line-height: 1.8; }
  </style>
</head>
<body>

<div class="ins-wrap">
  <a href="index.html" class="ins-logo">ZOLA</a>

  <div class="ins-card">
    <div id="ins-main">
      <div class="ins-h">Send Your Inspo ✦</div>
      <div class="ins-sub" id="ins-lede">Pick the photo you want us to recreate. That's it — we'll take care of the rest.</div>
      <div class="ins-meta" id="ins-meta" style="display:none;"></div>

      <label class="ins-drop" for="ins-file" tabindex="0">
        <span class="ins-drop-ico">💅</span>
        <span class="ins-drop-t" id="ins-drop-t">Tap to choose your photo</span>
        <span class="ins-drop-s">From your camera roll or screenshots</span>
      </label>
      <input type="file" id="ins-file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;" />

      <div id="ins-preview"><img id="ins-img" alt="Your inspo photo" /></div>
      <div class="ins-actions" id="ins-actions">
        <button class="btn-gold ins-btn" id="ins-send" style="animation:none;">Send to My Artist ✦</button>
        <button class="btn-outline-dark ins-btn" id="ins-again">Choose a different photo</button>
      </div>
      <div class="ins-msg" id="ins-msg"></div>
    </div>

    <div class="ins-done" id="ins-done">
      <div class="ins-done-mark">✦</div>
      <div class="ins-done-t">Got it</div>
      <div class="ins-done-s" id="ins-done-s">Your artist can see it now. See you at your appointment.</div>
      <button class="btn-outline-dark ins-btn" id="ins-more" style="margin-top:1.25rem;">Send another photo</button>
    </div>
  </div>
</div>

<script>
const CODE = new URLSearchParams(location.search).get('c') || '';
let CTX = { client_name: '', service: '', appt_date: '', member_name: '' };
let PICKED = '';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const msg = (t, isErr) => { const m = $('ins-msg'); m.textContent = t; m.className = 'ins-msg' + (isErr ? ' err' : ''); };

// Pull their booking so the photo arrives tagged with their name without
// asking them to type anything. If the code is missing or unknown we still
// let them send — a photo we can match up by hand beats no photo at all.
(async function initCtx() {
  if (!CODE) { $('ins-lede').textContent = 'Pick the photo you want us to recreate, and tell us your name so we know who it is from.'; addNameField(); return; }
  try {
    const r = await fetch('/api/photos?action=inspo_context&c=' + encodeURIComponent(CODE));
    if (!r.ok) throw new Error('lookup failed');
    CTX = await r.json();
    const first = (CTX.client_name || '').split(' ')[0];
    if (first) $('ins-lede').textContent = 'Hi ' + first + ' — pick the photo you want us to recreate. That\'s it.';
    const bits = [];
    if (CTX.service) bits.push('<b>Service:</b> ' + esc(CTX.service));
    if (CTX.appt_date) bits.push('<b>Date:</b> ' + esc(CTX.appt_date));
    if (CTX.member_name) bits.push('<b>Your artist:</b> ' + esc(CTX.member_name));
    if (bits.length) { $('ins-meta').innerHTML = bits.join('<br>'); $('ins-meta').style.display = 'block'; }
  } catch (_) {
    addNameField();
  }
})();

function addNameField() {
  if ($('ins-name')) return;
  const wrap = document.createElement('div');
  wrap.innerHTML = '<label class="luxury-label">Your name</label>' +
    '<input class="luxury-input" id="ins-name" placeholder="Your name" style="margin-bottom:1.25rem;" />';
  $('ins-meta').insertAdjacentElement('afterend', wrap);
}

$('ins-file').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  msg('');
  const img = new Image(), reader = new FileReader();
  reader.onload = ev => { img.src = ev.target.result; };
  img.onload = () => {
    // Compress in the browser — phone photos are far too big to store raw,
    // and a failed upload here means she walks in with nothing to work from.
    const scale = Math.min(1, 1400 / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width * scale);
    cv.height = Math.round(img.height * scale);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    PICKED = cv.toDataURL('image/jpeg', 0.82);
    if (PICKED.length > 850000) PICKED = cv.toDataURL('image/jpeg', 0.6);
    if (PICKED.length > 850000) PICKED = cv.toDataURL('image/jpeg', 0.42);
    $('ins-img').src = PICKED;
    $('ins-preview').style.display = 'block';
    $('ins-actions').classList.add('on');
    $('ins-drop-t').textContent = 'Tap to choose a different photo';
  };
  img.onerror = () => msg('That file did not look like a photo — try another.', true);
  reader.onerror = () => msg('Could not read that file — try another.', true);
  reader.readAsDataURL(file);
});

$('ins-again').addEventListener('click', () => $('ins-file').click());
$('ins-more').addEventListener('click', () => {
  PICKED = ''; $('ins-file').value = '';
  $('ins-preview').style.display = 'none';
  $('ins-actions').classList.remove('on');
  $('ins-done').style.display = 'none';
  $('ins-main').style.display = 'block';
  msg('');
});

$('ins-send').addEventListener('click', async () => {
  if (!PICKED) { msg('Choose a photo first.', true); return; }
  const typed = $('ins-name') ? $('ins-name').value.trim() : '';
  const name = CTX.client_name || typed;
  if (!name) { msg('Please add your name so your artist knows who it is from.', true); return; }
  const btn = $('ins-send');
  btn.disabled = true; btn.textContent = 'Sending…';
  // Retry once — a client who tapped Send should not have to wonder.
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const r = await fetch('/api/photos?action=inspo', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'inspo', confirmation: CODE, client_name: name,
          service: CTX.service || '', appt_date: CTX.appt_date || '', data_url: PICKED,
        }),
      });
      if (r.ok) {
        $('ins-main').style.display = 'none';
        $('ins-done').style.display = 'block';
        $('ins-done-s').textContent = CTX.member_name
          ? CTX.member_name + ' can see it now. See you at your appointment.'
          : 'Your artist can see it now. See you at your appointment.';
        return;
      }
      const d = await r.json().catch(() => ({}));
      if (r.status === 413) { msg(d.error || 'That photo is too large — try another.', true); break; }
      if (attempt === 1) msg(d.error || 'Could not send it — please try once more.', true);
    } catch (_) {
      if (attempt === 1) msg('Network problem — please try once more.', true);
    }
  }
  btn.disabled = false; btn.textContent = 'Send to My Artist ✦';
});
</script>
</body>
</html>
