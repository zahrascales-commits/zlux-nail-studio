<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Appointment — ZOLA Nail Studio</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/img/zola-icon.png" />
<meta name="theme-color" content="#140d07" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@200;300;400;600&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
<script src="https://js.stripe.com/v3/"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --espresso:#0D0D0D; --cream:#F5EEE8; --champagne:#C4A882;
    --latte:#8C7A5E; --soft:#FAF7F4;
  }
  body{background:var(--soft);font-family:'Josefin Sans',sans-serif;color:var(--espresso);
    min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:2rem 1.25rem 4rem}

  .brand{text-align:center;margin-bottom:1.75rem}
  .brand .mark{font-family:'Cinzel',serif;font-size:1.5rem;letter-spacing:0.4em;
    color:var(--espresso);text-indent:0.4em}
  .brand .sub{font-size:0.62rem;letter-spacing:0.24em;text-transform:uppercase;
    color:var(--latte);margin-top:0.35rem}

  .card{background:#fff;border:1px solid rgba(182,165,136,0.28);padding:1.6rem 1.4rem;margin-bottom:1rem}
  .card h2{font-family:'Cinzel',serif;font-weight:400;font-size:1.25rem;margin-bottom:0.3rem}
  .card p{font-size:0.88rem;color:var(--latte);line-height:1.75}

  .appt{background:var(--espresso);color:var(--cream);padding:1.5rem 1.4rem;margin-bottom:1rem}
  .appt .who{font-family:'Cinzel',serif;font-size:1.35rem;margin-bottom:0.15rem}
  .appt .what{font-size:0.88rem;color:var(--champagne);margin-bottom:0.9rem}
  .appt .when{font-size:0.92rem;line-height:1.8}
  .appt .when b{color:#fff;font-weight:400}

  .amt{font-family:'Cinzel',serif;font-size:2.4rem;line-height:1;margin:0.4rem 0 0.2rem}
  .paid{display:inline-block;font-size:0.66rem;letter-spacing:0.16em;text-transform:uppercase;
    color:#3c8c50;border:1px solid #3c8c50;padding:0.35rem 0.8rem;border-radius:100px}

  /* Every service that day, and the one number to pay across all of them. */
  .lines{border-top:1px solid rgba(182,165,136,0.28);margin:0.8rem 0 0.6rem}
  .line{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;
    padding:0.55rem 0;border-bottom:1px solid rgba(182,165,136,0.18);font-size:0.9rem}
  .line .l-what i{display:block;font-style:normal;font-size:0.74rem;color:var(--latte)}
  .line .l-amt{white-space:nowrap}
  .line .l-paid{font-weight:400;font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;
    color:#3c8c50;border:1px solid #3c8c50;padding:0.12rem 0.45rem;border-radius:100px;margin-left:0.3rem}
  .line.sum{font-size:0.84rem;color:var(--latte)}
  .line.due{font-family:'Cinzel',serif;font-size:1.25rem;color:var(--espresso);border-bottom:none}
  .btn{display:block;width:100%;background:var(--espresso);color:var(--champagne);border:none;
    font-family:'Josefin Sans',sans-serif;font-size:0.74rem;font-weight:600;letter-spacing:0.18em;
    text-transform:uppercase;padding:1rem;cursor:pointer;margin-top:1rem;min-height:50px}
  .btn.gold{background:var(--champagne);color:var(--espresso)}
  .btn:disabled{opacity:0.5;cursor:default}

  #card-el{border:1px solid rgba(182,165,136,0.4);padding:0.9rem;background:var(--soft);margin-top:1rem}

  .drop{border:1px dashed rgba(182,165,136,0.55);background:var(--soft);padding:1.6rem 1rem;
    text-align:center;cursor:pointer;margin-top:1rem}
  .drop:hover{border-color:var(--champagne)}
  .drop .big{font-size:1.6rem;margin-bottom:0.4rem}
  .drop .t{font-size:0.85rem;color:var(--espresso)}
  .drop .s{font-size:0.74rem;color:var(--latte);margin-top:0.25rem}
  #file{display:none}

  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:0.5rem;margin-top:0.9rem}
  .shot{position:relative}
  .shot img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border:1px solid rgba(182,165,136,0.3)}
  .shot button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,0.7);border:none;color:#fff;
    width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:0.72rem;line-height:1;padding:0}

  .msg{font-size:0.84rem;margin-top:0.8rem;min-height:1.2em}
  .msg.err{color:#a04038}
  .msg.ok{color:#3c8c50}
  .note{width:100%;border:1px solid rgba(182,165,136,0.4);background:var(--soft);
    font-family:inherit;font-size:0.88rem;padding:0.75rem 0.85rem;margin-top:0.8rem;outline:none;resize:vertical}
  .foot{text-align:center;font-size:0.74rem;color:var(--latte);margin-top:2rem;line-height:1.8}
  .foot a{color:var(--champagne)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark">ZOLA</div>
    <div class="sub">Nail Studio · Porterville</div>
  </div>

  <div id="body"><div class="card"><p>Loading your appointment…</p></div></div>

  <div class="foot">
    Questions? DM <a href="https://instagram.com/zola_officials_" target="_blank" rel="noopener">@zola_officials_</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const money = c => '$' + (Number(c || 0) / 100).toFixed(2).replace(/\.00$/, '');

const TOKEN = new URLSearchParams(location.search).get('t') || '';
let V = null, stripe = null, elements = null, cardEl = null;
let PICKED = [];   // photos chosen but not sent yet

/* Shrink until it fits — the same loop the booking page uses. Any picture a
   phone can produce ends up sendable, which is the whole point: somebody
   sending a screenshot of a set they love should never meet an error. */
const LIMIT = 2600000;
async function shrinkToFit(file){
  let bmp = null;
  try { if (window.createImageBitmap) bmp = await createImageBitmap(file); } catch (_) {}
  if (!bmp) {
    bmp = await new Promise((resolve, reject) => {
      const img = new Image(), r = new FileReader();
      r.onload = e => { img.src = e.target.result; };
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('That file is not a picture this phone can open — a screenshot or a camera-roll photo will work.'));
      r.onerror = () => reject(new Error('Could not read that file.'));
      r.readAsDataURL(file);
    });
  }
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
  if (!w0 || !h0) throw new Error('That file is not a picture.');
  let maxDim = 2200, q = 0.9, out = '';
  for (let i = 0; i < 12; i++) {
    const scale = Math.min(1, maxDim / Math.max(w0, h0));
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(w0 * scale));
    cv.height = Math.max(1, Math.round(h0 * scale));
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
    out = cv.toDataURL('image/jpeg', q);
    if (out.length <= LIMIT) return out;
    if (q > 0.5) q -= 0.12; else maxDim = Math.round(maxDim * 0.8);
  }
  return out;
}

/* Two clients with real bookings were told their appointment did not
   exist because the database blinked once. The page now tries again, and
   only calls it a bad link when the studio has actually said so. */
async function load(attempt){
  attempt = attempt || 1;
  if(!TOKEN){ $('body').innerHTML = '<div class="card"><h2>Link incomplete</h2><p>That link is missing its code. Check the message it came in, or DM the studio.</p></div>'; return; }

  let res, body;
  try{
    res = await fetch('/api/visit?t=' + encodeURIComponent(TOKEN));
    body = await res.json();
  }catch(_){ body = { error: '', retry: true }; res = { ok: false, status: 0 }; }

  const temporary = !res.ok && (body.retry || res.status === 0 || res.status >= 500);

  if(temporary && attempt < 4){
    // Backing off a little each time rather than hammering a system that
    // is already struggling.
    $('body').innerHTML = '<div class="card"><h2>One moment…</h2>'
      + '<p>Reaching the studio. Your appointment is safe.</p></div>';
    await new Promise(function(r){ setTimeout(r, attempt * 900); });
    return load(attempt + 1);
  }

  if(body.error || !res.ok){
    const stillTrying = temporary;
    $('body').innerHTML = '<div class="card"><h2>' + (stillTrying ? 'We could not reach the studio' : 'We could not find that') + '</h2>'
      + '<p>' + esc(body.error || 'Something went wrong at our end.') + '</p>'
      + (stillTrying ? '<button class="btn" style="margin-top:1rem" onclick="load(1)">Try again</button>' : '')
      + '</div>';
    return;
  }

  V = body;

  /* Back from a payment method that had to leave the page. The address is
     tidied first, so recording it cannot send this round again. */
  const back = new URLSearchParams(location.search).get('payment_intent');
  if(back){
    history.replaceState({}, '', '/visit.html?t=' + encodeURIComponent(TOKEN));
    try{
      await fetch('/api/visit?action=paid', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ t: TOKEN, payment_intent_id: back }),
      });
      return load(1);
    }catch(_){ /* the webhook records it either way */ }
  }

  render();
}

function render(){
  /* The deposit is for everything booked that day, not just this service.
     One amount, one payment — a second service with its own separate deposit
     is how one of them got left unpaid. */
  const due = Number(V.due_cents != null ? V.due_cents : (V.deposit_paid ? 0 : V.deposit_cents)) || 0;
  const owes = due > 0;
  const list = Array.isArray(V.services) && V.services.length ? V.services : null;
  const many = !!(list && list.length > 1);

  $('body').innerHTML =
    '<div class="appt">'
      + '<div class="who">' + esc(V.client || 'Your appointment') + '</div>'
      + (many
          ? '<div class="what">' + list.length + ' services' + (V.artist ? ' · with ' + esc(V.artist) : '') + '</div>'
            + '<div class="when"><b>' + esc(V.date_pretty) + '</b></div>'
          : '<div class="what">' + esc(V.service) + (V.artist ? ' · with ' + esc(V.artist) : '') + '</div>'
            + '<div class="when"><b>' + esc(V.date_pretty) + '</b> at <b>' + esc(V.time_pretty) + '</b></div>')
    + '</div>'

    // Deposit first — it is the thing with a deadline attached.
    + '<div class="card" id="pay-card">'
      + '<h2>' + (owes ? (many ? 'Your deposit for the day' : 'Your deposit') : 'Deposit') + '</h2>'
      /* Every service that day, with what is paid and what is not, so the
         number to pay is something they can check rather than take on trust. */
      + (many
          ? '<div class="lines">' + list.map(function(x){
              return '<div class="line">'
                + '<span class="l-what">' + esc(x.service) + '<i>' + esc(x.time_pretty) + '</i></span>'
                + '<span class="l-amt">' + (x.deposit_cents ? money(x.deposit_cents) : '—')
                  + (x.paid ? ' <b class="l-paid">paid</b>' : '') + '</span>'
                + '</div>';
            }).join('')
            + (Number(V.paid_cents) > 0
                ? '<div class="line sum"><span>Already paid</span><span>' + money(V.paid_cents) + '</span></div>' : '')
            + '<div class="line sum due"><span>' + (owes ? 'To pay now' : 'Left to pay') + '</span><span>' + money(due) + '</span></div>'
            + '</div>'
          : '')
      + (!owes
          ? (((list && list.some(function(x){ return x.paid; })) || V.deposit_paid)
              ? '<p style="margin-bottom:0.6rem">Paid — nothing more to do.</p><span class="paid">Paid ✓</span>'
              : '<p>No deposit needed for this one.</p>')
          : (many ? '' : '<div class="amt">' + money(due) + '</div>')
            + '<p>' + (many
                ? 'One payment covers every service above, and it comes off what you pay on the day.'
                : 'This holds your spot and comes off the price of your service.') + '</p>'
            /* Said before they pay, not buried afterwards. Keeping
               somebody's card without telling them is not a feature. */
            + '<p style="font-size:0.82rem;opacity:0.75;margin-top:0.5rem">'
              + 'We’ll keep this card on file so you can settle the rest at the studio '
              + 'without getting it out again. Nothing is ever charged to it without your '
              + 'signature at the desk.</p>'
            + '<div id="ap-hint" style="display:none;font-size:0.82rem;color:var(--latte);margin-top:0.7rem">'
              + '&#63743;&nbsp; Apple Pay is ready — double-tap the side button to pay.</div>'
            + '<div id="card-el"></div>'
            + '<button class="btn" id="pay-btn" onclick="pay()">Pay ' + money(due) + '</button>'
            + '<div class="msg" id="pay-msg"></div>')
    + '</div>'

    + '<div class="card">'
      + '<h2>Show us what you want</h2>'
      + '<p>Send a picture of the nails you have in mind'
        + (V.artist ? ' — it goes straight to ' + esc(V.artist) : '') + '. '
        + 'Screenshots are perfect. Add as many as you like.</p>'
      + '<div class="drop" onclick="document.getElementById(\'file\').click()">'
        + '<div class="big">📸</div>'
        + '<div class="t">Tap to add a photo</div>'
        + '<div class="s">Any size, any phone</div>'
      + '</div>'
      + '<input type="file" id="file" accept="image/*" multiple />'
      + '<div class="shots" id="shots"></div>'
      + '<textarea class="note" id="note" rows="2" placeholder="Anything to say about it? (optional)"></textarea>'
      + '<button class="btn gold" id="send-btn" onclick="sendPhotos()" disabled>Send to the studio</button>'
      + '<div class="msg" id="ins-msg">'
        + (V.inspo_count ? V.inspo_count + ' already sent ✓' : '') + '</div>'
    + '</div>';

  if(owes) setupCard();
  wireFile();
}

async function setupCard(){
  try{
    const cfg = await (await fetch('/api/pay?action=config')).json();
    // The endpoint returns publishable_key; reading publishableKey gave
    // undefined and Stripe failed silently at mount time.
    const pk = cfg && (cfg.publishable_key || cfg.publishableKey);
    if(!pk) { $('pay-msg').textContent = 'Card payments are not switched on yet — message the studio.'; return; }

    const due = Number(V.due_cents != null ? V.due_cents : V.deposit_cents) || 0;
    if(due < 50) return;

    stripe = Stripe(pk);
    /* The amount is known, so the element can be built without creating a
       payment on Stripe yet. That is what keeps her Stripe clean: opening
       the link to read it does not leave an abandoned payment behind. */
    elements = stripe.elements({
      mode: 'payment',
      amount: due,
      currency: 'usd',
      // Must say the same as the payment the server makes, or Stripe will
      // refuse it: when the booking has an email, the card is kept.
      ...(V.save_card ? { setupFutureUsage: 'off_session' } : {}),
      appearance: { theme: 'flat', variables: { colorPrimary: '#C4A882', fontFamily: 'Josefin Sans, sans-serif' } },
    });
    // wallets auto = Apple Pay and Google Pay appear by themselves where the
    // phone supports them, with the typed card underneath for everyone else.
    cardEl = elements.create('payment', { wallets: { applePay: 'auto', googlePay: 'auto' }, layout: 'tabs' });
    cardEl.mount('#card-el');

    if(/iPhone|iPad|Macintosh/.test(navigator.userAgent) && window.ApplePaySession){
      const hint = $('ap-hint');
      if(hint) hint.style.display = 'block';
    }
  }catch(_){ $('pay-msg').textContent = 'Could not load the payment form — refresh and try again.'; }
}

async function pay(){
  const btn = $('pay-btn'), msg = $('pay-msg');
  if(!stripe || !elements){ msg.textContent = 'Payment form is still loading.'; return; }
  btn.disabled = true; btn.textContent = 'Charging…';
  msg.className = 'msg'; msg.textContent = '';
  try{
    /* Checks what they entered before anything is created on Stripe, so a
       mistyped card leaves nothing behind. With Apple Pay this is where the
       sheet opens. */
    const ready = await elements.submit();
    // Kept whole, so a half-typed card reads as that rather than as a failure.
    if(ready.error) throw ready.error;

    const makeIntent = async (noSave) => {
      const it = await (await fetch('/api/visit?action=pay_intent', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ t: TOKEN, no_save: !!noSave })
      })).json();
      if(it.error) throw new Error(it.error);
      return it;
    };
    const confirmWith = (it) => stripe.confirmPayment({
      elements,
      clientSecret: it.client_secret,
      redirect: 'if_required',
      // Only used by a method that has to leave the page. Apple Pay does not.
      confirmParams: { return_url: location.origin + '/visit.html?t=' + encodeURIComponent(TOKEN) },
    });

    let intent = await makeIntent(false);
    let { error, paymentIntent } = await confirmWith(intent);

    /* If the form and the payment ever disagree about keeping the card,
       take the deposit without keeping it — the client should never be
       turned away over a setting they cannot see. */
    if(error && (error.param === 'setup_future_usage' || /setup_future_usage/.test(error.message || ''))){
      reportPayError(error);
      try { elements.update({ setupFutureUsage: null }); } catch (_) {}
      const again = await elements.submit();
      if(again.error) throw again.error;
      intent = await makeIntent(true);
      ({ error, paymentIntent } = await confirmWith(intent));
    }
    if(error) throw error;
    if(!paymentIntent || paymentIntent.status !== 'succeeded') throw new Error('That did not complete — you have not been charged.');

    await recordPaid(paymentIntent.id);
  }catch(err){
    btn.disabled = false; btn.textContent = 'Pay ' + money(V.due_cents != null ? V.due_cents : V.deposit_cents);
    msg.className = 'msg err';
    msg.textContent = friendlyPayError(err);
    // A half-typed card is not something the studio needs to hear about.
    if(!err || err.type !== 'validation_error') reportPayError(err);
  }
}

/* What the client reads. A decline from their bank already comes in plain
   words, so it is shown as it is; anything technical becomes something a
   person can act on. Either way: nothing was charged. */
function friendlyPayError(err){
  const e = err || {};
  if(e.type === 'card_error' || e.type === 'validation_error') return (e.message || 'That card did not go through.') + ' You have not been charged.';
  if(/canceled|cancelled|abort/i.test(e.message || '') || e.code === 'payment_intent_authentication_failure')
    return 'That payment was stopped before it finished — you have not been charged. Tap Pay to try again.';
  return 'That did not go through — you have not been charged. Please try again, or try a different card. If it keeps happening, message the studio and we will sort it out.';
}

/* The studio hears about it with the real reason. Never allowed to get in
   the way of the client trying again. */
function reportPayError(err){
  try{
    const e = err || {};
    fetch('/api/visit?action=pay_error', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
      body: JSON.stringify({ t: TOKEN, message: String(e.message || e).slice(0, 300), code: e.code || '',
        decline_code: e.decline_code || '', type: e.type || '',
        wallet: (window.ApplePaySession ? 'apple-pay-capable' : '') })
    }).catch(function(){});
  }catch(_){}
}

/* Tell the studio it cleared. Stripe also reports it through the webhook, so
   somebody who closes the page the instant it succeeds is still recorded —
   this is the quick path, not the only one. */
async function recordPaid(id){
  const done = await (await fetch('/api/visit?action=paid', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ t: TOKEN, payment_intent_id: id })
  })).json();
  if(done.error) throw new Error(done.error);
  await load(1);
}

function wireFile(){
  const f = $('file');
  if(!f) return;
  f.onchange = async () => {
    const files = [...(f.files || [])];
    if(!files.length) return;
    const msg = $('ins-msg');
    msg.className = 'msg'; msg.textContent = 'Getting your photos ready…';
    for(const file of files){
      try{ PICKED.push(await shrinkToFit(file)); }
      catch(err){ msg.className = 'msg err'; msg.textContent = err.message; }
    }
    f.value = '';
    drawShots();
    if(PICKED.length){ msg.className = 'msg'; msg.textContent = PICKED.length + ' ready to send'; }
  };
}

function drawShots(){
  $('shots').innerHTML = PICKED.map((src, i) =>
    '<div class="shot"><img src="' + src + '" alt=""><button onclick="dropShot(' + i + ')">×</button></div>'
  ).join('');
  $('send-btn').disabled = PICKED.length === 0;
}
function dropShot(i){ PICKED.splice(i, 1); drawShots(); }

async function sendPhotos(){
  const btn = $('send-btn'), msg = $('ins-msg');
  if(!PICKED.length) return;
  btn.disabled = true; btn.textContent = 'Sending…';
  const note = ($('note') || {}).value || '';
  let sent = 0;
  for(const src of PICKED){
    try{
      const r = await fetch('/api/visit?action=inspo', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ t: TOKEN, data_url: src, note })
      });
      const d = await r.json();
      if(!d.error) sent++;
    }catch(_){}
  }
  PICKED = []; drawShots();
  btn.textContent = 'Send to the studio';
  msg.className = sent ? 'msg ok' : 'msg err';
  msg.textContent = sent
    ? (sent + (sent === 1 ? ' photo sent' : ' photos sent') + (V.artist ? ' to ' + V.artist : '') + ' ✓')
    : 'None of those went through — try again in a moment.';
  if(sent){ V.inspo_count = (V.inspo_count || 0) + sent; }
}

load();
</script>
</body>
</html>
